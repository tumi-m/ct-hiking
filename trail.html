<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trail Detail — CT Hiking</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    #trail-map { height: 360px; }
  </style>
</head>
<body>

<div class="topo-bg">
  <svg id="topo-svg" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<nav class="nav">
  <a class="nav-logo" href="index.html">&#9968; CT <span>Hiking</span></a>
  <button class="nav-toggle" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="trails.html">Trails</a></li>
    <li><a href="map.html">Map</a></li>
    <li><a href="tips.html">Tips &amp; Safety</a></li>
    <li><a href="friends.html">Friends</a></li>
  </ul>
</nav>

<div id="trail-hero" class="trail-hero">
  <div class="container" id="trail-hero-content">
    <p style="color:rgba(255,255,255,0.7)">Loading…</p>
  </div>
</div>

<div class="page-content">
  <div class="container">
    <div class="trail-body">

      <!-- Left column -->
      <div>
        <div class="trail-map-box">
          <div class="box-title">Route map</div>
          <div id="trail-map"></div>
        </div>
        <div class="trail-chart-box">
          <div class="box-title">Elevation profile</div>
          <canvas id="elev-chart" height="180"></canvas>
        </div>
        <div class="trail-desc-box">
          <div class="box-title">About this trail</div>
          <p id="trail-desc"></p>
        </div>
      </div>

      <!-- Right column -->
      <div>
        <div class="trail-info-box">
          <div class="box-title">Trail info</div>
          <ul id="trail-info-list"></ul>
          <div id="permit-notice" class="permit-notice hidden"></div>
          <div id="pricing-note" class="pricing-note hidden"></div>
        </div>
        <div class="trail-gmaps-box">
          <div class="box-title">Location &amp; reviews</div>
          <iframe id="gmaps-frame" frameborder="0" style="border:0;width:100%;height:260px;display:block" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          <div class="gmaps-footer">
            <a id="gmaps-link" href="#" target="_blank" rel="noopener" class="btn btn-outline" style="width:100%;justify-content:center;font-size:0.85rem">See reviews on Google Maps →</a>
          </div>
        </div>
        <div style="margin-top:1rem">
          <a href="trails.html" class="btn btn-outline" style="width:100%;justify-content:center">← Back to all trails</a>
        </div>
      </div>

    </div>
  </div>
</div>

<footer class="footer">
  <p>Data sourced from <strong>SANParks</strong> and <strong>CapeNature</strong>. Built by <a href="https://github.com/tumi-m/ct-hiking" target="_blank">Tumi</a>.</p>
</footer>

<script src="js/main.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
  const slug = getParam('slug');
  if (!slug) { window.location = 'trails.html'; }

  loadTrails().then(trails => {
    const trail = trails.find(t => t.slug === slug);
    if (!trail) { window.location = 'trails.html'; return; }

    document.title = `${trail.name} — CT Hiking`;

    // Hero
    document.getElementById('trail-hero-content').innerHTML = `
      <div class="trail-hero-eyebrow">${trail.reserve} · ${trail.source}</div>
      <h1>${trail.name}</h1>
      <div class="trail-badges">
        <span class="badge ${difficultyClass(trail.difficulty)}">${trail.difficulty}</span>
        <span class="badge" style="background:rgba(255,255,255,0.15);color:#fff">${trail.type}</span>
        ${trail.permit_required ? '<span class="badge" style="background:#fff3cd;color:#856404">Permit required</span>' : ''}
      </div>
      <div class="trail-stats-row">
        <div class="trail-stat">
          <div class="trail-stat-value">${trail.distance_km} km</div>
          <div class="trail-stat-label">Distance</div>
        </div>
        <div class="trail-stat">
          <div class="trail-stat-value">${trail.elevation_gain_m} m</div>
          <div class="trail-stat-label">Elevation gain</div>
        </div>
        <div class="trail-stat">
          <div class="trail-stat-value">${trail.estimated_time}</div>
          <div class="trail-stat-label">Est. time</div>
        </div>
      </div>`;

    // Description
    document.getElementById('trail-desc').textContent = trail.description;

    // Info list
    const p = trail.pricing;
    const priceStr = !p || p.adult === 0
      ? 'Free'
      : p.child === null
        ? `R${p.adult} p.p.`
        : `Adult R${p.adult} · Child R${p.child}`;

    const infoItems = [
      ['Reserve',    trail.reserve],
      ['Source',     trail.source],
      ['Difficulty', trail.difficulty],
      ['Type',       trail.type],
      ['Distance',   `${trail.distance_km} km`],
      ['Elevation gain', `${trail.elevation_gain_m} m`],
      ['Estimated time', trail.estimated_time],
      ['Entry fee',  priceStr],
      ['Permit',     trail.permit_required ? 'Required' : 'Not required'],
    ];
    document.getElementById('trail-info-list').innerHTML =
      infoItems.map(([k, v]) => `<li><span class="info-key">${k}</span><span>${v}</span></li>`).join('');

    if (trail.permit_required && trail.permit_info) {
      const el = document.getElementById('permit-notice');
      el.textContent = '⚠ ' + trail.permit_info;
      el.classList.remove('hidden');
    }

    if (trail.pricing && trail.pricing.note) {
      const el = document.getElementById('pricing-note');
      el.textContent = 'ℹ ' + trail.pricing.note;
      el.classList.remove('hidden');
    }

    // Google Maps embed
    const { lat, lng } = trail.coordinates;
    document.getElementById('gmaps-frame').src =
      `https://maps.google.com/maps?q=${lat},${lng}&t=k&z=14&output=embed`;
    document.getElementById('gmaps-link').href =
      `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(trail.name + ' ' + trail.reserve)}`;

    // Map
    const map = L.map('trail-map').setView(
      [trail.coordinates.lat, trail.coordinates.lng], 13
    );
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 18
    }).addTo(map);

    const polyline = L.polyline(trail.polyline, { color: '#3a7d44', weight: 4, opacity: 0.9 }).addTo(map);
    map.fitBounds(polyline.getBounds(), { padding: [40, 40] });

    const startIcon = L.divIcon({
      html: '<div style="background:#3a7d44;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,0.4)"></div>',
      iconSize: [12, 12], iconAnchor: [6, 6], className: ''
    });
    const endIcon = L.divIcon({
      html: '<div style="background:#1a5276;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,0.4)"></div>',
      iconSize: [12, 12], iconAnchor: [6, 6], className: ''
    });
    L.marker(trail.polyline[0], { icon: startIcon }).addTo(map).bindPopup('Start');
    L.marker(trail.polyline[trail.polyline.length - 1], { icon: endIcon }).addTo(map).bindPopup('End / Summit');

    // Elevation chart
    const profile = trail.elevation_profile;
    const ctx = document.getElementById('elev-chart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: profile.map(p => p.distance + ' km'),
        datasets: [{
          label: 'Elevation (m)',
          data: profile.map(p => p.elevation),
          borderColor: '#3a7d44',
          backgroundColor: 'rgba(58,125,68,0.12)',
          borderWidth: 2.5,
          fill: true,
          tension: 0.4,
          pointRadius: 2,
          pointHoverRadius: 5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: { legend: { display: false } },
        scales: {
          x: {
            title: { display: true, text: 'Distance (km)', color: '#6b6557' },
            ticks: { color: '#6b6557', maxTicksLimit: 8 },
            grid: { color: 'rgba(0,0,0,0.05)' }
          },
          y: {
            title: { display: true, text: 'Elevation (m)', color: '#6b6557' },
            ticks: { color: '#6b6557' },
            grid: { color: 'rgba(0,0,0,0.05)' }
          }
        }
      }
    });
  });
</script>
</body>
</html>
